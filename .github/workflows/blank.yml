lname: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q AnimeLiveWallpaper.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: cd AnimeLiveWallpaper && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeLiveWallpaper-apk
          path: AnimeLiveWallpaper/app/build/outputs/apk/debug/app-debug.apk
